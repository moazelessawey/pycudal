name: Build Executables (Windows + Linux)

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: astral-sh/setup-uv@v3

      - name: Install package + PyInstaller
        run: uv pip install --system .[all,qt] pyinstaller

      - name: Build Tk GUI (Windows)
        shell: pwsh
        run: |
          pyinstaller --onefile --noconsole --name CuDAL-windows `
            --add-data "assets/logo.png;." `
            --hidden-import matplotlib.backends.backend_tkagg `
            cudal_gui.py

      - name: Build Qt GUI (Windows)
        shell: pwsh
        run: |
          pyinstaller --onefile --noconsole --name CuDAL-Qt-windows `
            --paths . `
            --collect-all cudal `
            --collect-all scipy `
            --collect-all pandas `
            --collect-all numpy `
            --add-data "assets/logo.png;." `
            --hidden-import matplotlib.backends.backend_qtagg `
            extras/cudal_gui_pyside6.py

      - uses: actions/upload-artifact@v4
        with:
          name: CuDAL-windows
          path: dist/*

      - name: Attach to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/CuDAL-windows.exe
            dist/CuDAL-Qt-windows.exe

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: astral-sh/setup-uv@v3

      - name: System libraries (Tk + Qt runtime)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            tk tk-dev \
            libgl1 libegl1 libopengl0 libxkbcommon0 libdbus-1-3 \
            libfontconfig1 libfreetype6 libx11-6 libx11-xcb1 libxcb1 \
            libxext6 libxrender1 libglib2.0-0

      - name: Install package + PyInstaller
        run: uv pip install --system .[all,qt] pyinstaller

      - name: Build Tk GUI (Linux)
        run: |
          pyinstaller --onefile --noconsole --name CuDAL-linux \
            --add-data "assets/logo.png:." \
            --hidden-import matplotlib.backends.backend_tkagg \
            cudal_gui.py

      - name: Build Qt GUI (Linux)
        run: |
          pyinstaller --onefile --noconsole --name CuDAL-Qt-linux \
            --paths . \
            --collect-all cudal \
            --collect-all scipy \
            --collect-all pandas \
            --collect-all numpy \
            --add-data "assets/logo.png:." \
            --hidden-import matplotlib.backends.backend_qtagg \
            extras/cudal_gui_pyside6.py

      - uses: actions/upload-artifact@v4
        with:
          name: CuDAL-linux
          path: dist/*

      - name: Attach to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/CuDAL-linux
            dist/CuDAL-Qt-linux