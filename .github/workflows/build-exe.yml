name: Build Executables (Windows + Linux + macOS)

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runs-on: windows-latest
            os-key: win
            ext: ".exe"
            sep: ";"
          - runs-on: ubuntu-latest
            os-key: linux
            ext: ""
            sep: ":"
          - runs-on: macos-latest   # Apple Silicon; add a macos-13 / macos-x64 entry for Intel Macs
            os-key: macos
            ext: ""
            sep: ":"
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: astral-sh/setup-uv@v3

      # v1.0.8 -> 1.0.8 ; non-tag (manual) runs get dev-<short-sha>
      - name: Derive version for asset names
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "PKG_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "PKG_VERSION=dev-$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
          fi

      - name: System libraries (Linux only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libegl1 libopengl0 libxkbcommon0 libdbus-1-3 \
            libfontconfig1 libfreetype6 libx11-6 libx11-xcb1 libxcb1 \
            libxext6 libxrender1 libglib2.0-0

      - name: Install package + PyInstaller
        run: uv pip install --system ".[all,qt]" pyinstaller

      - name: Build PySide6 GUI
        shell: bash
        run: |
          NAME="pycudal-${PKG_VERSION}-${{ matrix.os-key }}"
          pyinstaller --onefile --noconsole --name "$NAME" \
            --paths . \
            --collect-all cudal --collect-all scipy --collect-all pandas --collect-all numpy \
            --add-data "assets/logo.png${{ matrix.sep }}." \
            --hidden-import matplotlib.backends.backend_qtagg \
            extras/cudal_gui_pyside6.py

      # On macOS, --noconsole produces a .app bundle (a directory); zip it so it
      # can be attached to the release as a single asset.
      - name: Zip macOS .app bundle
        if: runner.os == 'macOS'
        run: |
          NAME="pycudal-${PKG_VERSION}-macos"
          if [ -d "dist/${NAME}.app" ]; then
            ditto -c -k --sequesterRsrc --keepParent "dist/${NAME}.app" "dist/${NAME}.zip"
            rm -rf "dist/${NAME}.app"
          fi

      - name: Record final asset path
        shell: bash
        run: |
          NAME="pycudal-${PKG_VERSION}-${{ matrix.os-key }}"
          if [ -f "dist/${NAME}.zip" ]; then
            echo "ASSET=dist/${NAME}.zip" >> "$GITHUB_ENV"
          else
            echo "ASSET=dist/${NAME}${{ matrix.ext }}" >> "$GITHUB_ENV"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: pycudal-${{ matrix.os-key }}
          path: dist/*

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ASSET }}