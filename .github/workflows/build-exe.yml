name: Build executables
on:
  release:
    types: [published]

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      - name: Install package + tools
        run: |
          python -m pip install --upgrade pip
          pip install .[all,qt] pyinstaller

      - name: Build Tk GUI exe
        run: >
          pyinstaller --onefile --noconsole --name CuDAL
          --add-data "cudal/logo.png;cudal" cudal_gui.py

      - name: Build Qt GUI exe
        run: >
          pyinstaller --onefile --noconsole --name CuDAL-Qt
          --add-data "cudal/logo.png;cudal" extras/cudal_gui_pyside6.py

      - name: Attach exes to the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/CuDAL.exe
            dist/CuDAL-Qt.exe