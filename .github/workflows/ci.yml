name: CI
on:
  push: { branches: [main] }
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python-version }}" }
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install .[all,dev]
      - name: Tests
        run: pytest -q
      - name: Entry points
        run: |
          python -m cudal.cli --help
          python -m cudal --help
          python -m cudal.gui --selftest
          python -m pytest tests/ -q
